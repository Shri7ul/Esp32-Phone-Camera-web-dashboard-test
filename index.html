<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mobile Camera</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;

    background: #111827;
    color: white;

    font-family: Arial, sans-serif;

    text-align: center;
}

.container {
    width: 100%;
    max-width: 700px;

    margin: auto;
}

h1 {
    margin-top: 20px;
    font-size: 32px;
}

.subtitle {
    color: #cbd5e1;
    font-size: 17px;
    line-height: 1.5;
}

video {
    width: 100%;
    max-width: 650px;

    aspect-ratio: 16 / 9;

    object-fit: contain;

    background: black;

    border-radius: 20px;

    margin-top: 25px;

    border: 3px solid #374151;
}

button {

    border: none;

    border-radius: 12px;

    padding: 15px 23px;

    margin: 10px 5px;

    font-size: 16px;

    color: white;

    cursor: pointer;
}

#startBtn {
    background: #22c55e;
}

#switchBtn {
    background: #3b82f6;
}

#stopBtn {
    background: #ef4444;
}

#status {

    margin-top: 20px;

    font-size: 17px;

    line-height: 1.5;

    color: #facc15;
}

.success {
    color: #22c55e !important;
}

.error {
    color: #ef4444 !important;
}

.info {
    color: #60a5fa !important;
}

</style>

</head>


<body>


<div class="container">

    <h1>📱 Mobile Camera</h1>

    <div class="subtitle">

        This camera will be shared with the
        Room Monitoring Dashboard.

    </div>


    <video
        id="localVideo"
        autoplay
        playsinline
        muted>
    </video>


    <div>

        <button
            id="startBtn"
            onclick="startCamera()">

            Start Camera

        </button>


        <button
            id="switchBtn"
            onclick="switchCamera()">

            Switch Camera

        </button>


        <button
            id="stopBtn"
            onclick="stopCamera()">

            Stop Camera

        </button>

    </div>


    <div
        id="status"
        class="info">

        Initializing...

    </div>

</div>


<script>


// =====================================================
// VARIABLES
// =====================================================

let peer = null;

let localStream = null;

let currentCall = null;

let facingMode = "environment";

let dashboardPeerID = null;


// =====================================================
// READ URL
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


dashboardPeerID =
    params.get("peer");


console.log(
    "Dashboard Peer ID:",
    dashboardPeerID
);


// =====================================================
// ELEMENTS
// =====================================================

const video =
    document.getElementById(
        "localVideo"
    );


const status =
    document.getElementById(
        "status"
    );


// =====================================================
// STATUS FUNCTION
// =====================================================

function setStatus(
    message,
    className = "info"
) {

    console.log(message);

    status.innerText = message;

    status.className = className;

}


// =====================================================
// CHECK DASHBOARD ID
// =====================================================

if (!dashboardPeerID) {

    setStatus(
        "❌ Dashboard ID missing.",
        "error"
    );

} else {

    setStatus(
        "Dashboard found. Connecting...",
        "info"
    );

    createPeer();

}


// =====================================================
// CREATE PEER
// =====================================================

function createPeer() {


    peer = new Peer({

        debug: 2,

        config: {

            iceServers: [

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }

            ]

        }

    });


    // -------------------------------------------------
    // Peer opened
    // -------------------------------------------------

    peer.on(
        "open",
        function(id) {

            console.log(
                "PHONE PEER ID:",
                id
            );


            setStatus(
                "✅ Connected to signaling server.",
                "success"
            );


            // Start camera automatically

            startCamera();

        }
    );


    // -------------------------------------------------
    // Peer error
    // -------------------------------------------------

    peer.on(
        "error",
        function(error) {

            console.error(
                "PEER ERROR:",
                error
            );


            setStatus(
                "❌ PeerJS error: " +
                error.type,
                "error"
            );

        }
    );


    // -------------------------------------------------
    // Disconnected
    // -------------------------------------------------

    peer.on(
        "disconnected",
        function() {

            setStatus(
                "⚠️ Disconnected from signaling server.",
                "error"
            );

        }
    );


    // -------------------------------------------------
    // Closed
    // -------------------------------------------------

    peer.on(
        "close",
        function() {

            setStatus(
                "Peer connection closed.",
                "error"
            );

        }
    );

}


// =====================================================
// START CAMERA
// =====================================================

async function startCamera() {

    try {


        // ---------------------------------------------
        // Browser support
        // ---------------------------------------------

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            setStatus(
                "❌ Camera API unavailable. HTTPS is required.",
                "error"
            );

            return;

        }


        // ---------------------------------------------
        // Stop previous stream
        // ---------------------------------------------

        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        setStatus(
            "📷 Requesting camera permission...",
            "info"
        );


        // ---------------------------------------------
        // Get phone camera
        // ---------------------------------------------

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: facingMode
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }

                    },

                    audio: false

                });


        // ---------------------------------------------
        // Local preview
        // ---------------------------------------------

        video.srcObject =
            localStream;


        await video.play()
            .catch(
                error =>
                console.log(
                    "Local video play:",
                    error
                )
            );


        setStatus(
            "📷 Camera ON — connecting to dashboard...",
            "info"
        );


        // ---------------------------------------------
        // Send to dashboard
        // ---------------------------------------------

        callDashboard();

    }

    catch(error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        setStatus(
            "❌ Camera error: " +
            error.name +
            " - " +
            error.message,
            "error"
        );

    }

}


// =====================================================
// CALL DASHBOARD
// =====================================================

function callDashboard() {


    if (!peer) {

        setStatus(
            "⏳ Peer not ready.",
            "info"
        );

        return;

    }


    if (!peer.open) {

        setStatus(
            "⏳ Waiting for PeerJS...",
            "info"
        );


        setTimeout(
            callDashboard,
            1000
        );


        return;

    }


    if (!localStream) {

        setStatus(
            "❌ Camera stream unavailable.",
            "error"
        );

        return;

    }


    if (!dashboardPeerID) {

        setStatus(
            "❌ Dashboard ID missing.",
            "error"
        );

        return;

    }


    console.log(
        "CALLING DASHBOARD:",
        dashboardPeerID
    );


    currentCall =
        peer.call(
            dashboardPeerID,
            localStream
        );


    if (!currentCall) {

        setStatus(
            "❌ Failed to create WebRTC call.",
            "error"
        );

        return;

    }


    setStatus(
        "📡 Camera stream sent. Waiting for dashboard...",
        "info"
    );


    // -------------------------------------------------
    // Call stream
    // -------------------------------------------------

    currentCall.on(
        "stream",
        function(stream) {

            console.log(
                "Received remote stream."
            );

        }
    );


    // -------------------------------------------------
    // Call closed
    // -------------------------------------------------

    currentCall.on(
        "close",
        function() {

            setStatus(
                "Dashboard disconnected.",
                "error"
            );

        }
    );


    // -------------------------------------------------
    // Call error
    // -------------------------------------------------

    currentCall.on(
        "error",
        function(error) {

            console.error(
                "CALL ERROR:",
                error
            );


            setStatus(
                "❌ WebRTC error.",
                "error"
            );

        }
    );

}


// =====================================================
// SWITCH CAMERA
// =====================================================

async function switchCamera() {


    facingMode =
        facingMode === "environment"
            ? "user"
            : "environment";


    setStatus(
        "Switching camera...",
        "info"
    );


    await startCamera();

}


// =====================================================
// STOP CAMERA
// =====================================================

function stopCamera() {


    if (currentCall) {

        currentCall.close();

        currentCall = null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        localStream = null;

    }


    video.srcObject = null;


    setStatus(
        "Camera stopped.",
        "info"
    );

}

</script>


</body>

</html>
